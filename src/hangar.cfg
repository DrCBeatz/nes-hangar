# MMC1 mode3, eight physical16KiB PRG banks. Switchable banks share an
# identical COMMON window; fixed code/audio always remain at $C000-$FFFF.
# Bank3 overlays producer-only visibility tables with render/projection code.
# The builder mirrors all other MAP bytes there and verifies the overlay.
# Every bank ends with identical STARTUP/VECTORS, so COMMON ends by $BFEF.
MEMORY {
 HEADER: start=$0000, size=$0010, file=%O;
 ZP: start=$0000, size=$0100, type=rw, file="";
 RAM: start=$0200, size=$0600, type=rw, file="";
 AUDIO_RAM: start=$0543, size=$00D8, type=rw, file="";
 AUDIO_ZP_MEMORY: start=$00B9, size=$0008, type=rw, file="";
 WRAM: start=$6000, size=$2000, type=rw, file="";
 MAP: start=$8000, size=$2000, file=%O, fill=yes, fillval=$FF;
 COMMON: start=$A000, size=$2000, file=%O, fill=yes, fillval=$FF;
 ART: start=$8000, size=$2000, file=%O, fill=yes, fillval=$FF;
 COMMON_COPY1: start=$A000, size=$2000, file=%O, fill=yes, fillval=$FF;
 BOOT: start=$8000, size=$2000, file=%O, fill=yes, fillval=$FF;
 COMMON_COPY2: start=$A000, size=$2000, file=%O, fill=yes, fillval=$FF;
 RENDER_PREFIX: start=$8000, size=$0D00, file=%O, fill=yes, fillval=$FF;
 RENDER: start=$8D00, size=$1000, file=%O, fill=yes, fillval=$FF;
 RENDER_SUFFIX: start=$9D00, size=$0300, file=%O, fill=yes, fillval=$FF;
 COMMON_COPY3: start=$A000, size=$2000, file=%O, fill=yes, fillval=$FF;
 SPARE4: start=$8000, size=$2000, file=%O, fill=yes, fillval=$FF;
 COMMON_COPY4: start=$A000, size=$2000, file=%O, fill=yes, fillval=$FF;
 SPARE5: start=$8000, size=$2000, file=%O, fill=yes, fillval=$FF;
 COMMON_COPY5: start=$A000, size=$2000, file=%O, fill=yes, fillval=$FF;
 SPARE6: start=$8000, size=$2000, file=%O, fill=yes, fillval=$FF;
 COMMON_COPY6: start=$A000, size=$2000, file=%O, fill=yes, fillval=$FF;
 PRG: start=$C000, size=$3FF0, file=%O, fill=yes, fillval=$FF;
 STARTUP: start=$FFF0, size=$000A, file=%O, fill=yes, fillval=$FF;
 VECTORS: start=$FFFA, size=$0006, file=%O;
}
SEGMENTS {
 HEADER: load=HEADER, type=ro;
 ZEROPAGE: load=ZP, type=zp;
 BSS: load=RAM, type=bss, align=$100;
 AUDIO_ENGINE: load=AUDIO_RAM, type=bss, define=yes;
 AUDIO_DRIVER: load=AUDIO_RAM, type=bss, define=yes;
 AUDIO_SETTINGS: load=AUDIO_RAM, type=bss, define=yes;
 AUDIO_ZP: load=AUDIO_ZP_MEMORY, type=zp, define=yes;
 WORK: load=WRAM, type=bss;
 MAPDATA: load=MAP, type=ro, align=$100;
 ACTOR_ART: load=ART, type=ro, align=$100;
 BOOTDATA: load=BOOT, type=ro, align=$100;
 CREDITSDATA: load=SPARE4, type=ro, define=yes;
 RODATA: load=COMMON, type=ro, align=$100;
 CODE: load=PRG, type=ro, align=$100;
 AUDIO_CODE: load=PRG, type=ro, optional=yes;
 RENDER_CODE: load=RENDER, type=ro, define=yes, align=$10;
 STARTUP: load=STARTUP, type=ro;
 VECTORS: load=VECTORS, type=ro;
}
