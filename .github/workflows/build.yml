name: Build and verify ROM

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Install assembler and linker
        run: |
          sudo apt-get update
          sudo apt-get install --yes cc65
      - name: Rebuild the checked-in ROM
        run: python3 tools/build.py --verify
      - name: Upload verified ROM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hangar-ntsc
          path: build/hangar-ntsc.nes
          if-no-files-found: error
